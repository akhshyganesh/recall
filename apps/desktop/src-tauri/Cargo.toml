[package]
name = "recall"
version = "0.5.2"
description = "Local AI coding session history search"
authors = ["Akhshy Ganesh <akhshyganesh@users.noreply.github.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/akhshyganesh/recall"

[lib]
name = "recall_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "5"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
similar = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ts-rs = { version = "10", features = ["serde-compat"] }
axum = "0.8"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
