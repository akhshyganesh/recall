[package]
name = "recall"
version = "0.1.0"
description = "Local AI coding session history search"
authors = ["you"]
edition = "2021"

[lib]
name = "recall_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
walkdir = "2"
regex = "1"
dirs = "5"
notify = "6"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
log = "0.4"
env_logger = "0.11"
similar = "2"

